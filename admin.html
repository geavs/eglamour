<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Admin - E-Glamour</title>
</head>
<body style="font-family: Arial; padding: 40px; text-align: center;">
    <h2>Shto Foton e Re te Koleksioni</h2>
    
    <input type="text" id="titullProduktit" placeholder="Emri i produktit (opsionale)" style="padding: 10px; width: 300px; margin-bottom: 10px;"><br>
    <input type="file" id="imageFile" accept="image/*" style="margin-bottom: 15px;"><br>
    <button id="uploadBtn" style="padding: 10px 20px; background: black; color: white; border: none; cursor: pointer;">Ngarko Foton</button>
    
    <p id="statusMsg" style="margin-top: 15px; font-weight: bold;"></p>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
  apiKey: "AIzaSyAxyXNIj6yxlg34gvG9UjVGaJ1hp24jQhU",
  authDomain: "eglamour-96ef2.firebaseapp.com",
  projectId: "eglamour-96ef2",
  storageBucket: "eglamour-96ef2.firebasestorage.app",
  messagingSenderId: "642095280499",
  appId: "1:642095280499:web:6c6fce141296f0ecb95506",
  measurementId: "G-YBRHT8YF16"
};

      const app = initializeApp(firebaseConfig);
      const storage = getStorage(app);
      const db = getFirestore(app);

      document.getElementById('uploadBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('imageFile');
        const titullInput = document.getElementById('titullProduktit').value;
        const statusMsg = document.getElementById('statusMsg');

        if (fileInput.files.length === 0) {
            alert("Zgjidhni një foto fillimisht!");
            return;
        }

        const file = fileInput.files[0];
        const storageRef = ref(storage, 'koleksioni/' + Date.now() + '_' + file.name);

        statusMsg.innerText = "Duke u ngarkuar...";

        try {
            const snapshot = await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(snapshot.ref);

            await addDoc(collection(db, "koleksioni"), {
                imageUrl: downloadURL,
                titull: titullInput,
                krijuarMe: new Date()
            });

            statusMsg.innerText = "Foto u ngarkua me sukses!";
            statusMsg.style.color = "green";
            fileInput.value = "";
            document.getElementById('titullProduktit').value = "";
        } catch (error) {
            console.error("Gabim:", error);
            statusMsg.innerText = "Ndodhi një gabim gjatë ngarkimit.";
            statusMsg.style.color = "red";
        }
      });
    </script>
</body>
</html>
