<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eglamour — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: #0c0a0b;
    color: #f4ede1;
    font-family: Arial, sans-serif;
    padding: 30px 20px;
  }

  .container {
    width: min(900px, 100%);
    margin: auto;
  }

  h1 {
    text-align: center;
    margin-bottom: 8px;
    font-family: Georgia, serif;
    font-weight: 400;
  }

  .subtitle {
    text-align: center;
    color: #c9bfb2;
    margin-bottom: 35px;
  }

  .box {
    background: #161215;
    border: 1px solid rgba(201,164,99,.25);
    padding: 28px;
    border-radius: 8px;
    margin-bottom: 25px;
  }

  label {
    display: block;
    margin-bottom: 7px;
    color: #e7cfa0;
    font-size: 13px;
  }

  input,
  textarea {
    width: 100%;
    background: #0c0a0b;
    color: #f4ede1;
    border: 1px solid rgba(244,237,225,.2);
    padding: 13px;
    border-radius: 4px;
    margin-bottom: 18px;
    font-size: 14px;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  button {
    border: 0;
    background: linear-gradient(115deg, #f5a623, #ec2f8e, #8e2de2);
    color: #0c0a0b;
    font-weight: bold;
    padding: 13px 22px;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    opacity: .9;
  }

  .logout {
    background: transparent;
    color: #c9bfb2;
    border: 1px solid rgba(244,237,225,.2);
    margin-bottom: 20px;
  }

  #adminPanel {
    display: none;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
  }

  .item {
    background: #1d181b;
    border: 1px solid rgba(244,237,225,.1);
    overflow: hidden;
    border-radius: 5px;
  }

  .item img {
    width: 100%;
    height: 280px;
    object-fit: cover;
  }

  .item-info {
    padding: 14px;
  }

  .item-title {
    font-family: Georgia, serif;
    font-size: 18px;
    margin-bottom: 6px;
  }

  .item-caption {
    color: #c9bfb2;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .delete {
    background: transparent;
    color: #ffb3b3;
    border: 1px solid rgba(255,100,100,.3);
    padding: 8px 12px;
    font-size: 12px;
  }

  #message {
    margin-top: 15px;
    color: #e7cfa0;
    font-size: 14px;
  }

  @media(max-width:700px) {
    .gallery {
      grid-template-columns: repeat(2, 1fr);
    }

    .item img {
      height: 230px;
    }
  }

  @media(max-width:480px) {
    .gallery {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<div class="container">

  <h1>Eglamour</h1>
  <p class="subtitle">Paneli i administrimit</p>

  <!-- LOGIN -->
  <div class="box" id="loginBox">

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Email-i i administratorit"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn">HYR</button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <button class="logout" id="logoutBtn">
      Dil nga paneli
    </button>


    <!-- ADD PHOTO -->
    <div class="box">

      <h2 style="font-family:Georgia,serif;font-weight:400;margin-bottom:25px;">
        Shto fustan
      </h2>

      <label>Fotografia</label>
      <input
        type="file"
        id="photo"
        accept="image/*"
      >

      <label>Emri i fustanit</label>
      <input
        type="text"
        id="title"
        placeholder="p.sh. Fustani i Kuq Gala"
      >

      <label>Përshkrimi</label>
      <textarea
        id="caption"
        placeholder="Përshkrimi i fustanit..."
      ></textarea>

      <button id="uploadBtn">
        SHTO FOTOGRAFINË
      </button>

      <div id="message"></div>

    </div>


    <!-- GALLERY -->
    <div class="box">

      <h2 style="font-family:Georgia,serif;font-weight:400;margin-bottom:25px;">
        Fotot aktuale
      </h2>

      <div class="gallery" id="gallery"></div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://mssafqnydjpuwypxlkfe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_C1EU2sQMWoxaQzpqVa0KlQ_mqix8KyF";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ELEMENTS

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const loginMessage =
  document.getElementById("loginMessage");

const message =
  document.getElementById("message");


// LOGIN

document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    loginMessage.textContent =
      "Duke u futur...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      loginMessage.textContent =
        "Email ose password i gabuar.";

      console.error(error);

      return;
    }

    loginMessage.textContent = "";

    showAdmin();

  });


// SHOW ADMIN

async function showAdmin() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) return;

  loginBox.style.display = "none";
  adminPanel.style.display = "block";

  loadGallery();

}


// LOGOUT

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    adminPanel.style.display = "none";
    loginBox.style.display = "block";

  });


// UPLOAD

document
  .getElementById("uploadBtn")
  .addEventListener("click", async () => {

    const file =
      document.getElementById("photo").files[0];

    const title =
      document.getElementById("title").value.trim();

    const caption =
      document.getElementById("caption").value.trim();


    if (!file) {
      message.textContent =
        "Zgjidh një fotografi.";
      return;
    }

    if (!title) {
      message.textContent =
        "Vendos emrin e fustanit.";
      return;
    }


    message.textContent =
      "Duke ngarkuar fotografinë...";


    const fileName =
      Date.now() + "-" +
      file.name.replace(/[^a-zA-Z0-9.-]/g, "-");


    const filePath =
      fileName;


    const { error: uploadError } =
      await supabaseClient.storage
        .from("gallery")
        .upload(filePath, file);


    if (uploadError) {

      console.error(uploadError);

      message.textContent =
        "Gabim gjatë ngarkimit.";

      return;
    }


    const { data: publicData } =
      supabaseClient.storage
        .from("gallery")
        .getPublicUrl(filePath);


    const imageUrl =
      publicData.publicUrl;


    const { error: databaseError } =
      await supabaseClient
        .from("gallery")
        .insert({
          image_url: imageUrl,
          title: title,
          caption: caption
        });


    if (databaseError) {

      console.error(databaseError);

      message.textContent =
        "Foto u ngarkua, por pati problem me databazën.";

      return;
    }


    message.textContent =
      "Fotografia u shtua me sukses! ✓";


    document.getElementById("photo").value = "";
    document.getElementById("title").value = "";
    document.getElementById("caption").value = "";


    loadGallery();

  });


// LOAD GALLERY

async function loadGallery() {

  const { data, error } =
    await supabaseClient
      .from("gallery")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    return;
  }


  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";


  data.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";


    div.innerHTML = `

      <img
        src="${item.image_url}"
        alt="${item.title}"
      >

      <div class="item-info">

        <div class="item-title">
          ${item.title}
        </div>

        <div class="item-caption">
          ${item.caption || ""}
        </div>

        <button
          class="delete"
          onclick="deleteImage('${item.id}', '${item.image_url}')"
        >
          FSHI
        </button>

      </div>

    `;


    gallery.appendChild(div);

  });

}


// DELETE

async function deleteImage(id, imageUrl) {

  if (!confirm("Ta fshijmë këtë fotografi?")) {
    return;
  }


  const fileName =
    imageUrl.split("/").pop();


  const { error: storageError } =
    await supabaseClient.storage
      .from("gallery")
      .remove([fileName]);


  if (storageError) {

    console.error(storageError);

  }


  const { error: databaseError } =
    await supabaseClient
      .from("gallery")
      .delete()
      .eq("id", id);


  if (databaseError) {

    console.error(databaseError);

    alert("Nuk u fshi fotografia.");

    return;
  }


  loadGallery();

}


// CHECK EXISTING SESSION

supabaseClient.auth
  .getSession()
  .then(({ data }) => {

    if (data.session) {
      showAdmin();
    }

  });

</script>

</body>
</html>
